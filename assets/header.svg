<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Adarsh Pathade, frontend-focused web developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090c14"/>
      <stop offset="1" stop-color="#0f1426"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset=".5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glowViolet">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".25"/>
      <stop offset=".6" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".3"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="340" fill="url(#gridFade)"/></mask>
    <clipPath id="frame"><rect width="1200" height="340" rx="18"/></clipPath>
    <clipPath id="typeClip"><rect class="typer" x="152" y="72" width="70" height="28"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }

    .drift1 { animation: drift1 14s ease-in-out infinite; }
    .drift2 { animation: drift2 18s ease-in-out infinite; }
    @keyframes drift1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(70px, 40px); } }
    @keyframes drift2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-80px, -30px); } }

    .typer { animation: type 1.1s steps(6) .5s forwards; }
    @keyframes type { to { transform: translateX(70px); } }

    .cursor { opacity: 0; animation: blink 1s steps(1) 1.6s infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }

    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2, .7, .2, 1) forwards; }
    .d1 { animation-delay: 1.6s; }
    .d2 { animation-delay: 1.85s; }
    .d3 { animation-delay: 2.1s; }
    .d4 { animation-delay: 2.35s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    .word { opacity: 0; animation: cycle 12s ease-in-out infinite; }
    .w1 { animation-delay: 2.4s; }
    .w2 { animation-delay: 5.4s; }
    .w3 { animation-delay: 8.4s; }
    .w4 { animation-delay: 11.4s; }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(10px); }
      3%, 22% { opacity: 1; transform: translateY(0); }
      25%, 100% { opacity: 0; transform: translateY(-10px); }
    }

    .spin { transform-origin: 980px 172px; animation: spin 40s linear infinite; }
    .spinRev { transform-origin: 980px 172px; animation: spin 26s linear infinite reverse; }
    .spinFast { transform-origin: 980px 172px; animation: spin 12s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .pulse { transform-origin: 980px 172px; animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)" mask="url(#gridMask)"/>
    <circle class="drift1" cx="260" cy="40" r="280" fill="url(#glowViolet)"/>
    <circle class="drift2" cx="1020" cy="300" r="300" fill="url(#glowCyan)"/>

    <!-- window chrome -->
    <circle cx="34" cy="32" r="6" fill="#ff5f57"/>
    <circle cx="54" cy="32" r="6" fill="#febc2e"/>
    <circle cx="74" cy="32" r="6" fill="#28c840"/>
    <text class="mono" x="1166" y="37" font-size="13" fill="#7d8590" text-anchor="end">~/adarzhpathade/README.md</text>
    <line x1="0" y1="58" x2="1200" y2="58" stroke="#ffffff" stroke-opacity=".06"/>

    <!-- prompt -->
    <text class="mono" x="64" y="94" font-size="18" fill="#7d8590" textLength="140" lengthAdjust="spacingAndGlyphs"><tspan fill="#22d3ee">adarsh</tspan>@dev<tspan fill="#a78bfa">:~$</tspan></text>
    <text class="mono" x="222" y="94" font-size="18" fill="#e6edf3" textLength="66" lengthAdjust="spacingAndGlyphs" clip-path="url(#typeClip)">whoami</text>
    <rect class="cursor" x="294" y="79" width="10" height="19" fill="#e6edf3"/>

    <!-- name -->
    <g class="rise d1">
      <text class="sans" x="62" y="164" font-size="64" font-weight="800" letter-spacing="-1.5" fill="#f0f6fc">Adarsh <tspan fill="url(#accent)">Pathade</tspan></text>
    </g>

    <g class="rise d2">
      <text class="sans" x="64" y="204" font-size="20" fill="#9da7b3">Frontend developer crafting fast, animated &amp; accessible UIs.</text>
    </g>

    <!-- rotating stack -->
    <g class="rise d3">
      <text class="mono" x="64" y="246" font-size="17" fill="#7d8590" textLength="250" lengthAdjust="spacingAndGlyphs">&gt; currently building with</text>
    </g>
    <g class="mono" font-size="17" font-weight="700">
      <text class="word w1" x="330" y="246" fill="#60a5fa">React &amp; Next.js</text>
      <text class="word w2" x="330" y="246" fill="#a78bfa">TypeScript</text>
      <text class="word w3" x="330" y="246" fill="#22d3ee">GSAP &amp; Framer Motion</text>
      <text class="word w4" x="330" y="246" fill="#4ade80">Node.js &amp; PostgreSQL</text>
    </g>

    <!-- pills -->
    <g class="rise d4 mono" font-size="13">
      <rect x="64" y="274" width="196" height="30" rx="15" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
      <circle cx="82" cy="289" r="4" fill="#a78bfa"/>
      <text x="94" y="293.5" fill="#c9d1d9">B.Tech CS &amp; IT · '28</text>

      <rect x="272" y="274" width="150" height="30" rx="15" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
      <circle cx="290" cy="289" r="4" fill="#60a5fa"/>
      <text x="302" y="293.5" fill="#c9d1d9">DSA in Java</text>

      <rect x="434" y="274" width="210" height="30" rx="15" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
      <circle cx="452" cy="289" r="4" fill="#4ade80"/>
      <text x="464" y="293.5" fill="#c9d1d9">Going full-stack →</text>
    </g>

    <!-- orbit art -->
    <circle class="pulse" cx="980" cy="172" r="64" fill="url(#glowViolet)"/>
    <g class="spin" fill="none">
      <circle cx="980" cy="172" r="118" stroke="#ffffff" stroke-opacity=".10" stroke-dasharray="2 10"/>
      <circle cx="1098" cy="172" r="5" fill="#22d3ee"/>
      <circle cx="862" cy="172" r="3" fill="#60a5fa"/>
    </g>
    <g class="spinRev" fill="none">
      <circle cx="980" cy="172" r="86" stroke="url(#accent)" stroke-opacity=".55" stroke-dasharray="120 60 20 60"/>
      <circle cx="980" cy="86" r="4.5" fill="#a78bfa"/>
    </g>
    <g class="spinFast" fill="none">
      <circle cx="980" cy="172" r="56" stroke="#ffffff" stroke-opacity=".08"/>
      <circle cx="1036" cy="172" r="3" fill="#f0f6fc"/>
    </g>
    <circle cx="980" cy="172" r="38" fill="#0b0f1a" stroke="#ffffff" stroke-opacity=".14"/>
    <text class="mono" x="980" y="180" font-size="22" font-weight="700" fill="url(#accent)" text-anchor="middle">&lt;/&gt;</text>

    <rect x=".5" y=".5" width="1199" height="339" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  </g>
</svg>
