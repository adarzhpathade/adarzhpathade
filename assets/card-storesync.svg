<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-label="StoreSync: store management platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f19"/><stop offset="1" stop-color="#101627"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#4ade80"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="f"><rect width="600" height="260" rx="16"/></clipPath>
  </defs>
  <style>
    .glow { animation: drift 10s ease-in-out infinite; }
    @keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-40px, 20px); } }
    .shine { animation: sweep 6s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-260px) skewX(-20deg); } 40%, 100% { transform: translateX(660px) skewX(-20deg); } }
  </style>
  <g clip-path="url(#f)">
    <rect width="600" height="260" fill="url(#bg)"/>
    <circle class="glow" cx="560" cy="20" r="220" fill="url(#glow)"/>
    <rect class="shine" x="0" y="0" width="200" height="260" fill="url(#shine)"/>
    <rect width="600" height="3" fill="url(#ac)"/>
    <text x="568" y="64" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="48" font-weight="700" fill="#ffffff" fill-opacity=".06">02</text>
    <text x="32" y="46" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" letter-spacing="2" fill="url(#ac)">STORE MANAGEMENT PLATFORM</text>
    <text x="32" y="88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="32" font-weight="800" letter-spacing="-.5" fill="#f0f6fc">StoreSync</text>
    <text y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" fill="#9da7b3"><tspan x="32" dy="0">Fast, no-bloat operations hub for single-store</tspan><tspan x="32" dy="22">owners: POS billing, inventory, worker</tspan><tspan x="32" dy="22">management and PDF invoices.</tspan></text>
    <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12"><rect x="32" y="192" width="74" height="26" rx="13" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/><text x="69.0" y="209" text-anchor="middle" fill="#c9d1d9">Next.js</text><rect x="114" y="192" width="96" height="26" rx="13" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/><text x="162.0" y="209" text-anchor="middle" fill="#c9d1d9">TypeScript</text><rect x="218" y="192" width="96" height="26" rx="13" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/><text x="266.0" y="209" text-anchor="middle" fill="#c9d1d9">PostgreSQL</text><rect x="322" y="192" width="74" height="26" rx="13" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/><text x="359.0" y="209" text-anchor="middle" fill="#c9d1d9">Drizzle</text><rect x="404" y="192" width="81" height="26" rx="13" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/><text x="444.5" y="209" text-anchor="middle" fill="#c9d1d9">Recharts</text></g>
    <text x="568" y="238" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#7d8590">view repo <tspan fill="#4ade80">→</tspan></text>
    <rect x=".5" y=".5" width="599" height="259" rx="16" fill="none" stroke="#ffffff" stroke-opacity=".09"/>
  </g>
</svg>
