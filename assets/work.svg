<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Selected work">
<defs><clipPath id="frame"><rect width="1200" height="220" rx="10"/></clipPath><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .6 0"/></filter></defs>
<style>
@font-face{font-family:'NM Light';src:url(data:font/woff2;base64,) format('woff2');}
.light{font-family:'NM Light','Helvetica Neue',Arial,sans-serif;}
@font-face{font-family:'Eiko Italic';src:url(data:font/woff2;base64,) format('woff2');}
.eiko{font-family:'Eiko Italic',Georgia,serif;}
@font-face{font-family:'Fragment Mono';src:url(data:font/woff2;base64,) format('woff2');}
.mono{font-family:'Fragment Mono',Consolas,monospace;}
.rise{opacity:0;animation:rise 1.1s cubic-bezier(.16,1,.3,1) forwards}@keyframes rise{from{opacity:0;transform:translateY(60%)}to{opacity:1;transform:translateY(0)}}.fade{opacity:0;animation:fade 1s ease forwards}@keyframes fade{to{opacity:1}}.blur{opacity:0;filter:blur(10px);animation:blurin .9s ease forwards}@keyframes blurin{to{opacity:1;filter:blur(0)}}
</style>
<g clip-path="url(#frame)">
<rect width="1200" height="220" fill="#ECECEC"/>
<text x="40.0" y="52.0" class="mono " font-size="12" fill="#080808" text-anchor="start" letter-spacing="1" fill-opacity=".55">(03)</text>
<text x="84.0" y="52.0" class="mono " font-size="12" fill="#080808" text-anchor="start" letter-spacing="1">— SELECTED WORK</text>
<text x="1160.0" y="52.0" class="mono " font-size="12" fill="#080808" text-anchor="end" letter-spacing="1" fill-opacity=".55">2 PROJECTS</text>
<line x1="40" y1="72" x2="1160" y2="72" stroke="#080808" stroke-opacity=".14"/>
<text x="40.0" y="180.0" class="light fade" font-size="76" fill="#080808" text-anchor="start" letter-spacing="0">SELECTED </text>
<text x="431.0" y="180.0" class="eiko fade" font-size="76" fill="#080808" text-anchor="start" letter-spacing="0">work</text>
<text x="1160.0" y="180.0" class="mono " font-size="12" fill="#080808" text-anchor="end" letter-spacing="1" fill-opacity=".55">(CLICK A PROJECT ↗)</text>
<rect width="1200" height="220" filter="url(#grain)" opacity=".05"/>
</g>
</svg>
