<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Let&#x27;s talk">
<defs><clipPath id="frame"><rect width="1200" height="460" rx="10"/></clipPath><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .6 0"/></filter><clipPath id="talkClip"><rect x="0" y="110" width="1200" height="230"/></clipPath></defs>
<style>
@font-face{font-family:'NM Light';src:url(data:font/woff2;base64,) format('woff2');}
.light{font-family:'NM Light','Helvetica Neue',Arial,sans-serif;}
@font-face{font-family:'Eiko Italic';src:url(data:font/woff2;base64,) format('woff2');}
.eiko{font-family:'Eiko Italic',Georgia,serif;}
@font-face{font-family:'Fragment Mono';src:url(data:font/woff2;base64,) format('woff2');}
.mono{font-family:'Fragment Mono',Consolas,monospace;}
.rise{opacity:0;animation:rise 1.1s cubic-bezier(.16,1,.3,1) forwards}@keyframes rise{from{opacity:0;transform:translateY(60%)}to{opacity:1;transform:translateY(0)}}.fade{opacity:0;animation:fade 1s ease forwards}@keyframes fade{to{opacity:1}}.blur{opacity:0;filter:blur(10px);animation:blurin .9s ease forwards}@keyframes blurin{to{opacity:1;filter:blur(0)}}.rise{transform-box:fill-box}
</style>
<g clip-path="url(#frame)">
<rect width="1200" height="460" fill="#080808"/>
<text x="40.0" y="52.0" class="mono " font-size="12" fill="#F0F0F0" text-anchor="start" letter-spacing="1" fill-opacity=".55">(04)</text>
<text x="84.0" y="52.0" class="mono " font-size="12" fill="#F0F0F0" text-anchor="start" letter-spacing="1">— CONTACT</text>
<text x="1160.0" y="52.0" class="mono " font-size="12" fill="#F0F0F0" text-anchor="end" letter-spacing="1" fill-opacity=".55">SAY HELLO</text>
<line x1="40" y1="72" x2="1160" y2="72" stroke="#F0F0F0" stroke-opacity=".14"/>
<g clip-path="url(#talkClip)"><g class="rise" style="animation-delay:.2s">
<text x="163.1" y="300.0" class="light " font-size="190" fill="#F0F0F0" text-anchor="start" letter-spacing="0">LET&#x27;S </text>
<text x="685.4" y="300.0" class="eiko " font-size="190" fill="#F0F0F0" text-anchor="start" letter-spacing="0">talk</text>
</g></g>
<text x="600.0" y="360.0" class="mono fade" font-size="12" fill="#F0F0F0" text-anchor="middle" letter-spacing="1" style="animation-delay:.9s">LINKS BELOW ↓</text>
<line x1="40" y1="400" x2="1160" y2="400" stroke="#F0F0F0" stroke-opacity=".14"/>
<text x="40.0" y="432.0" class="mono " font-size="11" fill="#F0F0F0" text-anchor="start" letter-spacing="1" fill-opacity=".55">ADARSH PATHADE ©2026</text>
<text x="1160.0" y="432.0" class="mono " font-size="11" fill="#F0F0F0" text-anchor="end" letter-spacing="1" fill-opacity=".55">MIXING CODE, AI, MOTION, &amp; VISUALS</text>
<rect width="1200" height="460" filter="url(#grain)" opacity=".05"/>
</g>
</svg>
