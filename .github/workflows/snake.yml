name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#080808&color_dots=#e4e4e4,#bdbdbd,#8a8a8a,#4d4d4d,#080808
            dist/snake-dark.svg?color_snake=#F0F0F0&color_dots=#1a1a1a,#3d3d3d,#6e6e6e,#a8a8a8,#F0F0F0

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
